[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".runtime",
    ".venv",
    "build",
    "chrome_profile",
    "dist",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
